    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique user identifier
          example: 123
        username:
          type: string
          pattern: "^[a-z0-9_.-]{3,16}$"
          description: Username (unique identifier)
          example: "hactazia"
        display:
          type: string
          pattern: "^.{3,32}$"
          description: Display name
          example: "Hactazia"
        server:
          type: string
          minLength: 1
          maxLength: 253
          description: Server address where the user is registered
          example: "hactazia.fr"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          minItems: 0
          maxItems: 50
          description: User tags and permissions
          example:
            [
              "sys:admin",
              "dft:can_file_upload",
              "dft:can_self_edit",
              "dft:can_world_create",
              "sys:unverified",
            ]
        bio:
          type: string
          nullable: true
          minLength: 0
          maxLength: 500
          description: User biography
          example: "Game developer and VR enthusiast"
        thumbnail:
          type: string
          nullable: true
          format: uri
          maxLength: 2048
          description: URL to user's profile picture
          example: "https://avr.hactazia.fr/api/users/123/thumbnail"
        banner:
          type: string
          nullable: true
          format: uri
          maxLength: 2048
          description: URL to user's banner image
          example: "https://avr.hactazia.fr/api/users/123/banner"
        links:
          type: array
          items:
            type: string
            format: uri
            maxLength: 2048
          minItems: 0
          maxItems: 10
          description: User's social links (validated URLs only)
          example: ["https://avr.hactazia.fr/"]
        rank:
          type: integer
          minimum: 0
          maximum: 1
          description: User rank given by admins (0 = unverified, 1 = verified)
          example: 0
        relations:
          allOf:
            - $ref: "#/components/schemas/UserRelations"
            - example:
                in: null
                out: null
