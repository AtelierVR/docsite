          description: Banner updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LargeImage"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "400 - InvalidField":
          description: Bad request due to invalid field values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidField"
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "401 - UnAuthorized":
          description: Unauthorized - user not authorized to perform this action
          content:
