  /users/@me/banner:
    get:
      operationId: fetchCurrentUserBanner
      tags:
        - users
      summary: Get current user's banner
      description: |-
        Retrieve the banner image of the currently authenticated user. Returns the image file directly if available, or a redirect to an external URL if the banner is remote.
      security:
        - BearerAuth: []
      responses:
        "200 - OK":
          description: The user's banner image
          content:
            image/*:
              schema:
                $ref: "#/components/schemas/LargeImage"
          headers:
            "Content-Type":
              description: The MIME type of the image
              schema:
                type: string
                example: "image/png"
            "Content-Disposition":
              description: How the image should be displayed (inline or attachment)
              schema:
                type: string
                example: "inline; filename=banner-123.png"
            "X-File-Hash":
              description: Hash of the file for integrity checks
              schema:
                type: string
                example: "30767347fcb5e38b967f622324383b88bdedf2081d7b1f1557717f178d74d171"
            "Content-Length":
              description: Size of the image file in bytes
              schema:
                type: integer
                example: 2007912
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "404 - NotFound":
          description: Banner not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotFound"
                  - type: object
                    example:
                      request: "/api/users/@me/banner"
        "301 - Redirect":
          description: Redirect to external banner URL
          headers:
            Location:
              description: The URL of the external banner
              schema:
                type: string
                format: uri
    post:
      operationId: updateCurrentUserBanner
      tags:
        - users
      summary: Update current user's banner
      description: |-
        Update the banner image of the currently authenticated user. The image must be a valid PNG, JPEG, or GIF file.
        The banner must be a large image (4:3 aspect ratio).
        If the banner is updated successfully, the response will work like a GET request to the same endpoint, returning the new banner image.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The new banner image file
              required:
                - file
