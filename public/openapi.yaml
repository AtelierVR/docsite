info:
  title: NOX API
  description: NOX REST API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      type: apiKey
      in: header
      name: Authorization
      x-auth-scheme: Bearer
      x-token-format: token
      description: User session token. Obtained from POST /api/auth/login.
    nox-challenge:
      type: apiKey
      in: header
      name: Authorization
      x-auth-scheme: Challenge
      x-token-format: <keyId_b64url>.<data_b64url>.<sig_b64url>
      description: >-
        Nox server-to-server challenge token. The payload is RSA-OAEP encrypted
        with the target server's public key and RSA-SHA256 signed with the
        sending server's private key.
    nox-as:
      type: apiKey
      in: header
      name: X-Nox-As
      x-token-format: number
      description: >-
        Internal user identifier of the federated user on whose behalf the
        remote server is acting. Only meaningful alongside a valid
        `nox-challenge` token.
  schemas:
    WebFingerLinkDto:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
          example: self
        type:
          type: string
          description: MIME type of the linked resource
          example: application/activity+json
        href:
          type: string
          description: URL of the linked resource
          example: https://example.com/users/alice
        template:
          type: string
          description: URL template with {uri} placeholder
          example: https://example.com/.well-known/webfinger?resource={uri}
      required:
        - rel
    WebFingerDocumentDto:
      type: object
      properties:
        subject:
          type: string
          description: 'Canonical identifier of the subject (acct: URI or URL)'
          example: acct:alice@example.com
        aliases:
          description: Alternate identifiers for the subject
          example:
            - https://example.com/users/alice
          type: array
          items:
            type: string
        links:
          description: Links describing the subject
          type: array
          items:
            $ref: '#/components/schemas/WebFingerLinkDto'
      required:
        - subject
        - links
    NodeInfoLinkDto:
      type: object
      properties:
        rel:
          type: string
          description: Relation type (schema URL)
          example: http://nodeinfo.diaspora.software/ns/schema/2.1
        href:
          type: string
          description: URL to the NodeInfo document
          example: https://example.com/nodeinfo/2.1
      required:
        - rel
        - href
    NodeInfoLinksDto:
      type: object
      properties:
        links:
          description: NodeInfo document links
          type: array
          items:
            $ref: '#/components/schemas/NodeInfoLinkDto'
      required:
        - links
    NoxSoftwareDto:
      type: object
      properties:
        name:
          type: string
          description: Software name
          example: nox
        version:
          type: string
          description: Software version string
          example: 1.0.0
      required:
        - name
        - version
    NoxGatewayDto:
      type: object
      properties:
        web:
          type: string
          description: HTTP/HTTPS base URL
          example: https://example.com
        ws:
          type: string
          description: WebSocket URL
          example: wss://example.com/api/ws
        api:
          type: string
          description: Public REST API base URL
          example: https://example.com/api/
      required:
        - web
        - ws
        - api
    NoxEndpointsDto:
      type: object
      properties:
        wellknown:
          type: string
          description: URL of this well-known document
          example: https://example.com/.well-known/nox
        webfinger:
          type: string
          description: WebFinger template URL with {uri} placeholder
          example: https://example.com/.well-known/webfinger?resource={uri}
        nodeinfo:
          type: string
          description: NodeInfo links document URL
          example: https://example.com/.well-known/nodeinfo
        configs:
          type: string
          description: URL of the server's Configuration
          example: https://example.com/api/configs
      required:
        - wellknown
        - webfinger
        - nodeinfo
        - configs
    NoxVersionsDto:
      type: object
      properties:
        node:
          type: string
          description: Node.js runtime version
          example: 20.0.0
        terms:
          type: string
          description: Terms of service document version
          example: '1.0'
        privacy:
          type: string
          description: Privacy policy document version
          example: '1.0'
        rules:
          type: string
          description: Rules document version
          example: '1.0'
      required:
        - node
        - terms
        - privacy
        - rules
    NoxMetadataDto:
      type: object
      properties:
        title:
          description: Instance display name. Either a plain string or a locale→string map.
          oneOf:
            - type: string
              example: My Nox Server
            - type: object
              additionalProperties:
                type: string
              example:
                en: My Nox Server
                fr: Mon Serveur Nox
        description:
          description: >-
            Instance description, or null. Either a plain string or a
            locale→string map.
          nullable: true
          oneOf:
            - type: string
              example: A social VR platform.
            - type: object
              additionalProperties:
                type: string
              example:
                en: A social VR platform.
                fr: Une plateforme VR sociale.
        icon:
          description: >-
            Instance icon. Either a single URL string, a theme-keyed map (e.g. {
            default: "url", dark: "url" }), or null.
          nullable: true
          oneOf:
            - type: string
              example: https://example.com/icon.png
            - type: object
              additionalProperties:
                type: string
              example:
                default: https://example.com/icon.png
                dark: https://example.com/icon.dark.png
        contact:
          type: string
          description: Contact info (email or URL), or null
          example: null
          nullable: true
        socials:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: >-
            Social links map. Keys are platform names (e.g. github, mastodon,
            discord, twitter, youtube); values are URL or array of URLs.
          example:
            github: https://github.com/org
            mastodon:
              - https://mastodon.social/@me
      required:
        - title
    NoxWellKnownDto:
      type: object
      properties:
        id:
          type: string
          description: Unique node identifier within a cluster
          example: node-abc123
        software:
          description: Software info
          allOf:
            - $ref: '#/components/schemas/NoxSoftwareDto'
        status:
          type: string
          description: Operational status
          enum:
            - online
            - maintenance
            - degraded
          example: online
        started:
          type: number
          description: Unix timestamp (ms) when this node started
          example: 1700000000000
        public:
          type: string
          description: Ed25519 public key (base64 SPKI DER)
          example: MCowBQYDK2VwAyEA…
        address:
          type: string
          description: Public domain address
          example: example.com
        port:
          type: number
          description: Listening port
          example: 443
        gateway:
          description: Gateway URLs
          allOf:
            - $ref: '#/components/schemas/NoxGatewayDto'
        endpoints:
          description: Protocol endpoint URLs
          allOf:
            - $ref: '#/components/schemas/NoxEndpointsDto'
        versions:
          description: Runtime versions
          allOf:
            - $ref: '#/components/schemas/NoxVersionsDto'
        metadata:
          description: Instance metadata
          allOf:
            - $ref: '#/components/schemas/NoxMetadataDto'
        features:
          description: Supported feature flags
          example: []
          type: array
          items:
            type: string
        capabilities:
          description: Supported capability flags
          example: []
          type: array
          items:
            type: string
        maintenance:
          type: string
          description: Maintenance message displayed to users, or null
          example: null
          nullable: true
      required:
        - id
        - software
        - status
        - started
        - public
        - address
        - port
        - gateway
        - endpoints
        - versions
        - metadata
        - features
        - capabilities
    NodeInfoSoftwareDto:
      type: object
      properties:
        name:
          type: string
          description: Software name
          example: nox
        version:
          type: string
          description: Software version
          example: 1.0.0
        repository:
          type: string
          description: Source code repository URL
          example: https://github.com/example/nox
        homepage:
          type: string
          description: Project homepage URL
          example: https://example.com
      required:
        - name
        - version
    NodeInfoUsageUsersDto:
      type: object
      properties:
        total:
          type: number
          description: Total registered user count
          example: 100
        activeMonth:
          type: number
          description: Users active in the past month
          example: 50
        activeHalfyear:
          type: number
          description: Users active in the past half-year
          example: 75
      required:
        - total
        - activeMonth
        - activeHalfyear
    NodeInfoUsageDto:
      type: object
      properties:
        users:
          description: User activity statistics
          allOf:
            - $ref: '#/components/schemas/NodeInfoUsageUsersDto'
        localPosts:
          type: number
          description: Total local posts
          example: 0
        localComments:
          type: number
          description: Total local comments
          example: 0
      required:
        - users
        - localPosts
    NodeInfoDocumentDto:
      type: object
      properties:
        version:
          type: string
          description: NodeInfo schema version
          example: '2.1'
        software:
          description: Server software info
          allOf:
            - $ref: '#/components/schemas/NodeInfoSoftwareDto'
        protocols:
          description: Supported federation protocols
          example: []
          type: array
          items:
            type: string
        usage:
          description: Usage statistics
          allOf:
            - $ref: '#/components/schemas/NodeInfoUsageDto'
        openRegistrations:
          type: boolean
          description: Whether open registration is enabled
          example: false
      required:
        - version
        - software
        - protocols
        - usage
        - openRegistrations
    ApiErrorDetailsDto:
      type: object
      properties:
        code:
          type: string
          description: Upper-snake-case error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error description
          example: Resource not found.
        status:
          type: integer
          description: HTTP status code
          example: 404
      required:
        - code
        - message
        - status
    ApiLinkResponseDto:
      type: object
      properties:
        label:
          type: string
          description: Link display label
          example: GitHub
        value:
          type: string
          description: Link URL
          example: https://github.com/johndoe
      required:
        - label
        - value
    ApiUserRelationsDto:
      type: object
      properties:
        out:
          type: string
          description: Outgoing relation type from current user to subject, or null
          example: follow
          nullable: true
        in:
          type: string
          description: Incoming relation type from subject to current user, or null
          example: null
          nullable: true
    ApiUserPresenceDto:
      type: object
      properties:
        status:
          type: string
          description: >-
            Presence status — one of: oja, ojf, online, busy, dnd, stream,
            offline
          example: online
        text:
          type: string
          description: Custom presence status text, or null
          example: null
          nullable: true
        locations:
          description: >-
            List of instance iids the user is currently in. null means the
            viewer has no permission to see this field.
          example: []
          nullable: true
          type: array
          items:
            type: string
      required:
        - status
    ApiAliasDto:
      type: object
      properties:
        key:
          type: string
          description: Alias key name
          example: iid
        value:
          type: string
          description: Alias value (NoxIdentifier or string)
          example: 1@my-server.com
      required:
        - key
        - value
    ApiCurrentUserDto:
      type: object
      properties:
        id:
          type: number
          description: Internal numeric user ID
          example: 1
        username:
          type: string
          description: Unique username (lowercase)
          example: johndoe
        display:
          type: string
          description: Public display name
          example: John Doe
        bio:
          type: string
          description: User biography, or null
          example: Full-stack developer
          nullable: true
        pronoun:
          type: string
          description: Pronouns, or null
          example: he/him
          nullable: true
        server:
          type: string
          description: Server hostname this user belongs to
