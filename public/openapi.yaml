components:
  schemas:
    Response:
      type: object
      properties:
        data:
          type: object
          description: The main response data
        request:
          type: string
          description: Original request path
          example: "/api/"
        time:
          type: integer
          format: int64
          description: Timestamp of the response in milliseconds
          example: 1750945093437
      required:
        - data
        - request
        - time

    Error:
      type: object
      $ref: "#/components/schemas/Response"
      description: Error response schema
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Error message describing the issue
              example: "Invalid field: limit, must be between 1 and 100."
            code:
              type: integer
              description: Error code indicating the type of error
              example: 5
            status:
              type: integer
              description: HTTP status code for the error
              example: 400
          required:
            - message
            - code
            - status

    UserNotFound:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when a user is not found
          properties:
            data:
              type: null
              description: Always null for user not found errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating user not found
                  example: "User not found."
                code:
                  type: integer
                  description: Error code for user not found
                  example: 2
                status:
                  type: integer
                  description: HTTP status code for user not found
                  example: 404
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    NotLogged:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when the user is not logged in
          properties:
            data:
              type: null
              description: Always null for not logged errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating user is not logged in
                  example: "You are not logged in."
                code:
                  type: integer
                  description: Error code for not logged in
                  example: 7
                status:
                  type: integer
                  description: HTTP status code for not logged in
                  example: 401
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    UnAuthorized:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when the user is not authorized to perform an action
          properties:
            data:
              type: null
              description: Always null for unauthorized errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating unauthorized access
                  example: "You are not authorized to {0}."
                code:
                  type: integer
                  description: Error code for unauthorized access
                  example: 8
                status:
                  type: integer
                  description: HTTP status code for unauthorized access
                  example: 401
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    AlreadyExists:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when a resource already exists
          properties:
            data:
              type: null
              description: Always null for already exists errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating the resource already exists
                  example: "{0} already exists with {1}."
                code:
                  type: integer
                  description: Error code for already exists
                  example: 6
                status:
                  type: integer
                  description: HTTP status code for already exists
                  example: 409
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    InvalidField:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when a field is invalid
          properties:
            data:
              type: null
              description: Always null for invalid field errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating the invalid field
                  example: "Invalid field: {0}, {1}."
                code:
                  type: integer
                  description: Error code for invalid field
                  example: 5
                status:
                  type: integer
                  description: HTTP status code for invalid field
                  example: 400
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    VerificationRequired:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Response when additional verification is required for sensitive changes
          properties:
            data:
              type: object
              description: Verification methods available for the user
              properties:
                methods:
                  type: array
                  description: List of verification methods available for the user
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [totp, email]
                        description: Type of verification method
                      name:
                        type: string
                        description: Name of the verification method
                      description:
                        type: string
                        description: Description of the verification method
                      enabled:
                        type: boolean
                        description: Whether this method is currently enabled for the user
                      can_send:
                        type: boolean
                        description: Whether a verification code can be sent using this method
                    required:
                      - type
                      - name
                      - description
                      - enabled
                      - can_send
                  example:
                    - type: "totp"
                      name: "Authenticator App"
                      description: "Use an authenticator app to generate a verification code"
                      enabled: true
                      can_send: false
                    - type: "email"
                      name: "Email Verification"
                      description: "Receive a verification code via email"
                      enabled: false
                      can_send: true
              required:
                - methods
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating verification is required
                  example: "Additional verification required."
                code:
                  type: integer
                  description: Error code for verification required
                  example: 20
                status:
                  type: integer
                  description: HTTP status code for verification required
                  example: 428
          required:
            - error
            - data

    NotFound:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response when a resource is not found
          properties:
            data:
              type: null
              description: Always null for not found errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating the resource was not found
                  example: "Resource not found."
                code:
                  type: integer
                  description: Error code for not found
                  example: 3
                status:
                  type: integer
                  description: HTTP status code for not found
                  example: 404
              required:
                - message
                - code
                - status
          required:
            - error
            - data

    InternalError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Error response for internal server errors
          properties:
            data:
              type: null
              description: Always null for internal errors
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Error message indicating an internal server error occurred
                  example: "An internal error occurred while trying to {0}."
                code:
                  type: integer
                  description: Error code for internal error
                  example: 9
                status:
                  type: integer
                  description: HTTP status code for internal error
                  example: 500
              required:
                - message
                - code
                - status
          required:
            - error
            - data

