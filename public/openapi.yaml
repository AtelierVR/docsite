openapi: 3.0.0
paths:
  /api/.well-known/webfinger:
    get:
      description: Actor resource discovery per RFC 7033.
      operationId: WellKnownController_webfinger
      parameters: []
      responses:
        '200':
          description: JRD document for the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebFingerDocumentDto'
        '400':
          description: Missing resource parameter.
        '404':
          description: No actor found for the given resource.
      summary: WebFinger
      tags:
        - Fediverse
  /api/.well-known/nodeinfo:
    get:
      description: Returns link to NodeInfo 2.1 document.
      operationId: WellKnownController_nodeInfo
      parameters: []
      responses:
        '200':
          description: NodeInfo links index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInfoLinksDto'
      summary: NodeInfo links
      tags:
        - Fediverse
  /api/.well-known/host-meta:
    get:
      description: XRD/XML document advertising the WebFinger endpoint template.
      operationId: WellKnownController_hostMeta
      parameters: []
      responses:
        '200':
          description: XRD/XML host-meta document.
          content:
            application/xrd+xml:
              schema:
                type: string
      summary: Host-Meta
      tags:
        - Fediverse
  /api/.well-known/nox:
    get:
      description: Returns server gateway URLs, features, and capabilities.
      operationId: WellKnownController_nox
      parameters: []
      responses:
        '200':
          description: NoxWellKnown document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoxWellKnownDto'
      summary: Nox instance metadata
      tags:
        - Fediverse
  /api/nodeinfo/2.1:
    get:
      description: Returns NodeInfo 2.1 document with software info and usage statistics.
      operationId: NodeInfoController_v21
      parameters: []
      responses:
        '200':
          description: NodeInfo 2.1 document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInfoDocumentDto'
      summary: NodeInfo 2.1
      tags:
        - Fediverse
  /api/files/{id}:
    get:
      description: Stream a stored file by its opaque ID.
      operationId: StorageController_serveFile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Serve file
      tags:
        - Storage
  /api/users/@me:
    get:
      description: Return the authenticated user profile.
      operationId: UsersController_getCurrent
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                  - time
                  - request
                properties:
                  data:
                    $ref: '#/components/schemas/ApiCurrentUserDto'
                    description: Response payload.
                  error:
                    type: 'null'
                    example: null
                    description: Always null for successful responses.
                  time:
                    type: integer
                    example: 1680000000000
                    description: Unix timestamp (ms) when the response was generated.
                  request:
                    type: string
                    example: /api/endpoint
                    description: Request path that produced this response.
        '401':
          description: Unauthorized — authentication required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                  - time
                  - request
                properties:
                  data:
                    type: 'null'
                    example: null
                    description: Always null for error responses.
                  error:
                    $ref: '#/components/schemas/ApiErrorDetailsDto'
                    description: Error details object.
                  time:
                    type: integer
                    example: 1680000000000
                    description: Unix timestamp (ms) when the response was generated.
                  request:
                    type: string
                    example: /api/endpoint
                    description: Request path that produced this response.
      security:
        - bearer: []
      summary: Get current user
      tags:
        - Users
