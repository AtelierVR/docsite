          description: New username
        display:
          type: [string, "null"]
          pattern: "^.{3,32}$"
          description: New display name
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
          description: New email address
        password:
          type: [string, "null"]
          minLength: 6
          maxLength: 128
          description: New password
        current_password:
          type: [string, "null"]
          minLength: 6
          maxLength: 128
          description: Current password (required to change password)
        twofa_token:
          type: [string, "null"]
          pattern: "^[0-9]{6}$"
          description: 6-digit 2FA token required for sensitive operations
        bio:
          type: [string, "null"]
          maxLength: 512
          description: User biography
        thumbnail:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: URL to user's profile picture
        banner:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: URL to user's banner image
        links:
          type: [array, "null"]
          items:
            type: string
            format: uri
            maxLength: 2048
          maxItems: 10
          description: User's social links
        home:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
          description: User's home world reference
        tags:
          type: [array, "null"]
          items:
            type: string
            pattern: "^usr:[a-z0-9_]+$"
            minLength: 5
            maxLength: 64
          minItems: 0
          maxItems: 50
          description: User tags only ("usr:country_fr")
      additionalProperties: false
      example:
        username: null
        display: null
        email: null
        password: null
        current_password: null
        twofa_token: null
        bio: null
        thumbnail: null
        banner: null
        links: null
        home: null
        tags: null

    SearchResult:
      type: object
