  /users/@me/sessions:
    get:
      operationId: fetchCurrentUserSessions
      tags:
        - sessions
      summary: Get current user's sessions
      description: |-
        Retrieve the list of active sessions for the currently authenticated user. This includes information about each session such as device type, IP address, and last activity time.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200 - OK":
          description: Current user's sessions retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionListResponse"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/@me/sessions"
        "401 - NotLogged":
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLogged"
    delete:
      operationId: deleteAllSessions
      tags:
        - sessions
      summary: Delete all sessions
      description: |-
        Delete all sessions for the current user, effectively logging them out from all devices.
      security:
        - BearerAuth: []
      responses:
        "200 - OK":
          description: All sessions deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logout:
                            type: boolean
        "401 - NotLogged":
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLogged"

  /users/@me/session:
    get:
      operationId: fetchCurrentSession
      tags:
        - sessions
      summary: Get current session
      description: |-
        Retrieve information about the current session.
      security:
        - BearerAuth: []
      responses:
        "200 - OK":
          description: Current session retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionDetail"
        "401 - NotLogged":
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLogged"
        "404 - SessionNotFound":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFound"

  /users/@me/sessions/{id}:
    get:
      operationId: fetchSession
      tags:
        - sessions
      summary: Get session by ID
      description: |-
        Retrieve a specific session by its ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200 - OK":
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionDetail"
        "401 - NotLogged":
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLogged"
        "404 - SessionNotFound":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFound"
    delete:
      operationId: deleteSession
      tags:
        - sessions
      summary: Delete session
      description: |-
        Delete a specific session by its ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200 - OK":
          description: Session deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logout:
                            type: boolean
                            description: True if the deleted session was the current session
        "401 - NotLogged":
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotLogged"
        "404 - SessionNotFound":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFound"

  /auth/login:
    post:
      operationId: userLogin
      tags:
        - authentication
      summary: User login
      description: |-
        Authenticate a user with their username or id and password. If successful, a session cookie will be set for the user.
        If the user has 2FA enabled, they must provide a valid factor code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200 - OK":
          description: User logged in successfully
          headers:
            "Set-Cookie":
              description: Session cookie for the authenticated user
              schema:
                type: string
                example: "_uid=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResponse"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/auth/login"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/auth/login"
        "400 - InvalidField":
          description: Bad request due to invalid field values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidField"
                  - type: object
                    example:
                      request: "/api/auth/login"
        "428 - VerificationRequired":
          description: Additional verification required for sensitive changes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VerificationRequired"
                  - type: object
                    example:
                      request: "/api/auth/login"

