openapi: 3.1.3

info:
  title: Nox API Documentation
  version: 0.0.1
  contact:
    name: Nox Team
    url: https://github.com/AtelierVR
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  description: |-
    The Nox API provides comprehensive functionality for managing multiplayer game experiences, including user authentication, world management, instance control, and social features.

servers:
  - url: https://nox.hactazia.fr/api
    description: Production server

tags:
  - name: users
    description: Users
  - name: authentication
    description: Authentication

paths:
  /users:
    get:
      operationId: searchUsers
      tags:
        - users
      summary: Search users
      description: |-
        Search for users by query string or specific user IDs. This endpoint supports pagination and can search by:
        - Text query matching username or display name
        - Specific user IDs or identifiers

        If authenticated, the response will include relationship information between the requesting user and each result.
      parameters:
        - name: query
          in: query
          required: false
          description: Text query to search for in usernames and display names
          schema:
            type: string
            example: "hact"
        - name: id
          in: query
          required: false
          description: Specific user ID or identifier to search for (can be array)
          schema:
            oneOf:
              - type: array
                items:
                  type: string
                example: []
              - type: string
                example: ""
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
        - name: offset
          in: query
          required: false
          description: Number of results to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200 - OK":
          description: Users search completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserSearchResult"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users?query=hact&limit=10"

  /users/@me:
    get:
      operationId: fetchCurrentUser
      tags:
        - users
      summary: Get current user
      description: |-
        Retrieve the current authenticated user's profile information. This endpoint requires authentication with a valid Bearer token.

        Returns extended user information including email, verification status, 2FA status, and creation date.
      security:
        - BearerAuth: []
      responses:
        "200 - OK":
          description: Current user profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserMe"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/@me"
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/users/@me"
    post:
      operationId: updateCurrentUser
      tags:
        - users
      summary: Update current user
      description: |-
        Update the profile of the currently authenticated user. Some sensitive changes (such as email or password) may require 2FA verification. If 2FA is required, the API will respond with a 428 and ErrorCodes.VerificationRequired.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserMe"
      responses:
        "200 - OK":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserMe"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/@me"
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "401 - UnAuthorized":
          description: Unauthorized - user not authorized to perform this action
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UnAuthorized"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "409 - AlreadyExists":
          description: Conflict with other user data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AlreadyExists"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "400 - InvalidField":
          description: Bad request due to invalid field values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidField"
                  - type: object
                    example:
                      request: "/api/users/@me"
        "428 - VerificationRequired":
          description: Additional verification required for sensitive changes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VerificationRequired"
                  - type: object
                    example:
                      request: "/api/users/@me"

  /users/{search}:
    get:
      operationId: fetchUser
      tags:
        - users
      summary: Get user
      description: |-
        Retrieve a user by their ID or username. The search parameter can be either:
        - A numeric user ID (e.g., "123")
        - A username (e.g., "hactazia")

        If authenticated, the response will include relationship information between the requesting user and the target user.
      parameters:
        - name: search
          in: path
          required: true
          description: User ID or username to search for
          schema:
            oneOf:
              - type: integer
                minimum: 1
                description: User ID
              - type: string
                pattern: "^[a-z0-9_.-]{3,16}$"
                description: Username
            examples:
              - "hactazia"
              - 123
      responses:
        "200 - OK":
          description: User found successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/hactazia"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/users/hactazia"

  /users/@me/thumbnail:
    get:
      operationId: fetchCurrentUserThumbnail
      tags:
        - users
      summary: Get current user's thumbnail
      description: |-
        Retrieve the profile picture (thumbnail) of the currently authenticated user. Returns the image file directly if available, or a redirect to an external URL if the thumbnail is remote.
      security:
        - BearerAuth: []
      responses:
        "200 - OK":
          description: The user's thumbnail image
          content:
            image/*:
              schema:
                $ref: "#/components/schemas/SquareImage"
          headers:
            "Content-Type":
              description: The MIME type of the image
              schema:
                type: string
                example: "image/png"
            "Content-Disposition":
              description: How the image should be displayed (inline or attachment)
              schema:
                type: string
                example: "inline; filename=thumbnail-123.png"
            "X-File-Hash":
              description: Hash of the file for integrity checks
              schema:
                type: string
                example: "30767347fcb5e38b967f622324383b88bdedf2081d7b1f1557717f178d74d171"
            "Content-Length":
              description: Size of the image file in bytes
              schema:
                type: integer
                example: 2007912
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "404 - UserNotFound":
          description: User not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserNotFound"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "404 - NotFound":
          description: Thumbnail not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotFound"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "301 - Redirect":
          description: Redirect to external thumbnail URL
          headers:
            Location:
              description: The URL of the external thumbnail
              schema:
                type: string
                format: uri
    post:
      operationId: updateCurrentUserThumbnail
      tags:
        - users
      summary: Update current user's thumbnail
      description: |-
        Update the profile picture (thumbnail) of the currently authenticated user. The image must be a valid PNG, JPEG, or GIF file.
        The thumbnail must be a square image (1:1 aspect ratio).
        If the thumbnail is updated successfully, the response will work like a GET request to the same endpoint, returning the new thumbnail image.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The new thumbnail image file
              required:
                - file
      responses:
        "200 - OK":
          description: Thumbnail updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SquareImage"
                    required:
                      - data
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "401 - NotLogged":
          description: Unauthorized - user not logged in or invalid token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NotLogged"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "400 - InvalidField":
          description: Bad request due to invalid field values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvalidField"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "401 - UnAuthorized":
          description: Unauthorized - user not authorized to perform this action
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UnAuthorized"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"
        "500 - InternalError":
          description: Internal server error occurred while processing the request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InternalError"
                  - type: object
                    example:
                      request: "/api/users/@me/thumbnail"

  /users/{search}/thumbnail:
